name: Build & Release Sabre Browser

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  # LINUX AMD64
  # ═══════════════════════════════════════════════════════════════
  build-linux-amd64:
    name: Build Linux (amd64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-webengine-dev \
            qt6-websockets-dev \
            libqt6webenginewidgets6 \
            libqt6webenginecore6 \
            qt6-webengine-dev-tools \
            libgl-dev \
            libegl-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            cmake \
            ninja-build \
            build-essential \
            dpkg-dev \
            imagemagick

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: cmake --build build --parallel --target sabre-browser

      - name: Generate icons
        run: |
          for size in 16 32 48 128 256; do
            mkdir -p packaging/icons/${size}x${size}
            convert apps/browser/assets/icons/mainlogo-nobackground.png \
              -resize ${size}x${size} \
              packaging/icons/${size}x${size}/sabre-browser.png
          done

      # ── Unlinked .deb (depends on system Qt) ──────────────────
      - name: Package unlinked .deb (amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ -z "$VERSION" || "$VERSION" == "main" ]] && VERSION="0.0.1"
          PKG="dist/sabre-browser_${VERSION}_amd64"
          mkdir -p ${PKG}/DEBIAN \
                   ${PKG}/usr/local/bin \
                   ${PKG}/usr/share/applications \
                   ${PKG}/usr/share/icons/hicolor/16x16/apps \
                   ${PKG}/usr/share/icons/hicolor/32x32/apps \
                   ${PKG}/usr/share/icons/hicolor/48x48/apps \
                   ${PKG}/usr/share/icons/hicolor/128x128/apps \
                   ${PKG}/usr/share/icons/hicolor/256x256/apps

          cp build/sabre-browser ${PKG}/usr/local/bin/

          for size in 16 32 48 128 256; do
            cp packaging/icons/${size}x${size}/sabre-browser.png \
               ${PKG}/usr/share/icons/hicolor/${size}x${size}/apps/
          done

          cat > ${PKG}/usr/share/applications/sabre-browser.desktop <<EOF
          [Desktop Entry]
          Name=Sabre Browser
          Comment=Fast, private, and clean web browsing
          Exec=sabre-browser %U
          Icon=sabre-browser
          Type=Application
          Categories=Network;WebBrowser;
          StartupWMClass=sabre-browser
          Terminal=false
          MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          cat > ${PKG}/DEBIAN/control <<EOF
          Package: sabre-browser
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Ernest Tech House <ernesttechhouse@gmail.com>
          Depends: libqt6webenginewidgets6, libqt6widgets6, libqt6network6, libqt6webenginecore6
          Description: Sabre Browser — Fast, private, and clean web browsing.
           Sabre is a Qt6-based browser built for speed and privacy.
           No telemetry. No ads. No DevTools panel.
          EOF

          cat > ${PKG}/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          update-desktop-database /usr/share/applications || true
          gtk-update-icon-cache /usr/share/icons/hicolor/ || true
          EOF
          chmod 755 ${PKG}/DEBIAN/postinst

          cat > ${PKG}/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          update-desktop-database /usr/share/applications || true
          gtk-update-icon-cache /usr/share/icons/hicolor/ || true
          EOF
          chmod 755 ${PKG}/DEBIAN/postrm

          dpkg-deb --build --root-owner-group ${PKG} \
            dist/sabre-browser_${VERSION}_amd64.deb

      # ── Unlinked tarball ───────────────────────────────────────
      - name: Package unlinked tarball (amd64)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ -z "$VERSION" || "$VERSION" == "main" ]] && VERSION="0.0.1"
          mkdir -p dist/sabre-browser-${VERSION}-linux-amd64
          cp build/sabre-browser dist/sabre-browser-${VERSION}-linux-amd64/
          tar -czf dist/sabre-browser-${VERSION}-linux-amd64.tar.gz \
            -C dist sabre-browser-${VERSION}-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-build
          path: |
            dist/sabre-browser_*.deb
            dist/sabre-browser-*-linux-amd64.tar.gz

  # ═══════════════════════════════════════════════════════════════
  # LINUX ARM64
