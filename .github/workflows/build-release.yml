          mkdir -p dist/sabre-browser-${VERSION}-linux-arm64
          cp build/sabre-browser dist/sabre-browser-${VERSION}-linux-arm64/
          tar -czf dist/sabre-browser-${VERSION}-linux-arm64.tar.gz \
