  # ═══════════════════════════════════════════════════════════════
  # WINDOWS
  # ═══════════════════════════════════════════════════════════════
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: "qtwebengine qtwebchannel qtpositioning qtwebsockets"
          cache: true
          dir: "C:/Qt"

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Find Qt and configure
        shell: powershell
        run: |
          $cmakeDir = Get-ChildItem "C:\Qt" -Recurse -Filter "Qt6Config.cmake" |
                      Select-Object -First 1 -ExpandProperty DirectoryName
          echo "QT_CMAKE_DIR=$cmakeDir" >> $env:GITHUB_ENV
          $qtRoot = Split-Path (Split-Path (Split-Path $cmakeDir))
          echo "QT_ROOT=$qtRoot" >> $env:GITHUB_ENV
          echo "QT_BIN=$qtRoot\bin" >> $env:GITHUB_ENV

      - name: Configure
        shell: cmd
        run: |
          mkdir build-win
          cd build-win
          cmake .. ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_CMAKE_DIR%" ^
            -G "Ninja"

      - name: Build
        shell: cmd
        run: cmake --build build-win --parallel --target sabre-browser

      - name: Package Windows zip
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          if ([string]::IsNullOrEmpty($version) -or $version -eq "main") { $version = "0.0.1" }
          $outDir = "dist\sabre-browser-win64"
          New-Item -ItemType Directory -Force $outDir
          Copy-Item "build-win\sabre-browser.exe" "$outDir\"
          $wdqt = Get-ChildItem "C:\Qt" -Recurse -Filter "windeployqt.exe" |
                  Select-Object -First 1 -ExpandProperty FullName
          & $wdqt --release --no-compiler-runtime "$outDir\sabre-browser.exe"
          @("QtWebEngineProcess.exe","resources","translations\qtwebengine_locales") | ForEach-Object {
            $src = Join-Path $env:QT_ROOT $_
            if (Test-Path $src) { Copy-Item -Recurse -Force $src "$outDir\" }
          }
          Compress-Archive -Path "$outDir\*" -DestinationPath "dist\sabre-browser-${version}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist\sabre-browser-*-windows-x64.zip

  # ═══════════════════════════════════════════════════════════════
  # RELEASE + APT REPO
  # ═══════════════════════════════════════════════════════════════
  release:
    name: Publish Release
    needs: [build-linux-amd64, build-linux-arm64, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Install apt repo tools
        run: sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons --fingerprint | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Sync existing pool from R2
        run: |
          mkdir -p apt-repo/pool/main apt-repo/dists/stable/main/binary-amd64
          wrangler r2 object list sabre-browser --prefix pool/main/ \
            --json 2>/dev/null | \
            jq -r '.[].key' | while read key; do
              mkdir -p "apt-repo/$(dirname $key)"
              wrangler r2 object get sabre-browser/"$key" \
                --file "apt-repo/$key" 2>/dev/null || true
            done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Add new .debs to pool
        run: |
          find release-artifacts -name "*.deb" -type f | while read deb; do
            cp "$deb" apt-repo/pool/main/
          done

      - name: Generate apt metadata
        run: |
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Ernest Tech House" \
            -o APT::FTPArchive::Release::Label="Sabre Browser" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Sabre Browser apt repository" \
            release dists/stable > dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback \
              --default-key ernesttechhouse@gmail.com \
              -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback \
              --default-key ernesttechhouse@gmail.com \
              --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Export public GPG key
        run: gpg --armor --export ernesttechhouse@gmail.com > apt-repo/sabre-browser-key.gpg

      - name: Upload apt repo to R2
        run: |
          find apt-repo -type f | while read file; do
            KEY="${file#apt-repo/}"
            wrangler r2 object put sabre-browser/"$KEY" \
              --file "$file" \
              --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Build changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -30)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -30)
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: reltype
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* ]]; then
            echo "LABEL=Beta" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-alpha"* ]]; then
            echo "LABEL=Alpha" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *"-rc"* ]]; then
            echo "LABEL=Release Candidate" >> $GITHUB_OUTPUT
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "LABEL=Stable" >> $GITHUB_OUTPUT
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - uses: softprops/action-gh-release@v2
        with:
          name: "Sabre Browser ${{ github.ref_name }}"
          body: |
            ## Sabre Browser ${{ github.ref_name }} — ${{ steps.reltype.outputs.LABEL }}

            > Fast. Private. Clean. No noise, no tracking, no DevTools.

            ### What's changed
            ${{ steps.changelog.outputs.NOTES }}

            ---

            ### Install via apt (Linux — recommended)

            ```sh
            curl -fsSL https://pub-35ea7aea1ae846babd7e2f81528d5c94.r2.dev/sabre-browser-key.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/sabre-browser.gpg

            echo 'deb [signed-by=/usr/share/keyrings/sabre-browser.gpg] https://pub-35ea7aea1ae846babd7e2f81528d5c94.r2.dev stable main' \
              | sudo tee /etc/apt/sources.list.d/sabre-browser.list

            sudo apt update && sudo apt install sabre-browser
            ```

            ---

            ### Manual install — Linux

            **amd64 .deb**
            ```sh
            sudo dpkg -i sabre-browser_*_amd64.deb
            ```

            **arm64 .deb**
            ```sh
            sudo dpkg -i sabre-browser_*_arm64.deb
            ```

            **tar.gz (no install)**
            ```sh
            tar -xzf sabre-browser-*-linux-amd64.tar.gz
            cd sabre-browser-*
            ./sabre-browser
            ```

            ---

            ### Manual install — Windows

            Download the `.zip`, extract it, and run `sabre-browser.exe`. No installer yet — just unzip and go.

            ---

            ### Bug reports

            Email **ernesttechhouse@gmail.com** with steps to reproduce and your distro/OS version.

          files: |
            release-artifacts/linux-amd64-build/*.deb
            release-artifacts/linux-amd64-build/*.tar.gz
            release-artifacts/linux-arm64-build/*.deb
            release-artifacts/linux-arm64-build/*.tar.gz
            release-artifacts/windows-build/*.zip
          draft: false
          prerelease: ${{ steps.reltype.outputs.PRERELEASE == 'true' }}
